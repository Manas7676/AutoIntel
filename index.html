<script>
// ===== SIMULATION LAYER: virtual telemetry with gradual degradation =====
const COL={h:'#22c55e',w:'#f59e0b',c:'#ef4444',m:'#f97316'};
const BASE={t:45,v:1.2,c:2.5,r:1450,l:60};
const FAULTS={bearing:{t:27,v:6,c:3.2,r:-330,n:'Bearing failure'},heat:{t:40,v:1,c:2,r:-100,n:'Motor overheat'},belt:{t:8,v:3,c:1.5,r:-200,n:'Belt misalignment'},joint:{t:12,v:4,c:2,r:-150,n:'Joint failure'},sensor:{t:0,v:0,c:0,r:0,n:'Sensor failure'}};
const defs=[['Raw Material Storage','storage',-14],['Conveyor 01','conveyor',-10],['Robot Arm 01','robot',-6],['Processing Machine','processing',-2],['Conveyor 02','conveyor',2],['Robot Arm 02','robot',6],['Quality Inspection','inspection',10],['Packaging Unit','packaging',14],['Vacuum System 01','utility',-6,-7],['Cooling Unit 01','utility',4,-7],['Utilities Compressor','utility',-14,-7],['Power & Control Room','utility',14,-7],['Conveyor 03','conveyor',8,6],['Finished Goods','storage',14,6]];
const M=defs.map((d,i)=>({i,name:d[0],type:d[1],x:d[2],z:d[3]||0,sev:0,tgt:0,fault:null,hrs:2000+i*713,
 tel:{...BASE,p:6,pw:8+i},hist:[],hmax:100,status:'h',pred:{},maint:false,prevS:'h'}));
M[2].sev=M[2].tgt=.28;M[2].fault='joint';M[6].sev=M[6].tgt=.3;M[6].fault='joint'; // Robot Arm 01 starts mildly degraded (warning)

// ===== AI LAYER: deterministic models over telemetry (swap for FastAPI/XGBoost) =====
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),sig=x=>1/(1+Math.exp(-x));
const AI={
 features(t){return{dv:(t.v-BASE.v)/BASE.v,dt:(t.t-BASE.t)/BASE.t,dc:(t.c-BASE.c)/BASE.c,dr:(BASE.r-t.r)/BASE.r};},
 combined(f){const n={v:clamp(f.dv/3,0,1),t:clamp(f.dt/.5,0,1),c:clamp(f.dc/.6,0,1),r:clamp(f.dr/.25,0,1)};n.s=.4*n.v+.25*n.t+.2*n.c+.15*n.r;return n;},
 detectAnomaly(t){const n=AI.combined(AI.features(t));return{score:sig(9*(n.s-.3)),n};},
 calculateHealth(n){return Math.round(clamp(100-62*n.s-2,20,99));},
 predictFailure(n,type){const p=sig(9*(n.s-.5));let f='Nominal';if(n.s>.15){f=n.t>n.v*1.3?'Motor overheating':(type==='robot'&&n.v>=n.r?'Robotic joint degradation':(n.v<.6&&n.r>n.t?'Belt misalignment':'Bearing degradation'));}return{p,f};},
 predictRUL(n){return n.s<.12?null:48*Math.pow(1-clamp(n.s,0,.97),1.6);},
 recommend(f){return({'Bearing degradation':'Inspect motor bearing and belt alignment.','Motor overheating':'Check cooling airflow; reduce load.','Belt misalignment':'Re-track belt and inspect tension.','Robotic joint degradation':'Lubricate/inspect joint actuator.'})[f]||'Continue monitoring.';},
 parts(f){return({'Bearing degradation':'Motor Bearing','Motor overheating':'Cooling Fan','Belt misalignment':'Conveyor Belt','Robotic joint degradation':'Joint Actuator'})[f];}
};
const STOCK={'Motor Bearing':[3,10],'Conveyor Belt':[5,8],'Temperature Sensor':[12,10],'Cooling Fan':[6,4],'Joint Actuator':[2,2]};
function step(dt){
 M.forEach(m=>{
  const r=(m.tgt>m.sev?.012:.03)*speed*dt;m.sev+=clamp(m.tgt-m.sev,-r,r);
  const F=FAULTS[m.fault]||{t:0,v:0,c:0,r:0},T=m.tel,nz=()=>(Math.random()-.5),s=m.sev;
  const tg={t:BASE.t+F.t*s+nz()*1.2,v:BASE.v+F.v*s+nz()*.15,c:BASE.c+F.c*s+nz()*.1,r:BASE.r+F.r*s+nz()*8,l:60+s*27+nz()*2};
  if(m.fault==='sensor'&&s>.3)tg.v+=Math.random()<.3?(Math.random()*5):0;
  for(const k in tg)T[k]+=(tg[k]-T[k])*.35;
  T.pw=(8+m.i)*(1+T.c/12);m.hrs+=dt*speed/3600*20;
  const a=AI.detectAnomaly(T),h=AI.calculateHealth(a.n),fp=AI.predictFailure(a.n,m.type);
  m.pred={anom:a.score,n:a.n,health:h,fp:fp.p,ftype:fp.f,rul:AI.predictRUL(a.n),rec:AI.recommend(fp.f)};
  m.hmax=Math.max(m.hmax*.9995,h);
  const st=m.maint?'m':h>80?'h':h>60?'w':'c';m.status=st;
  m.hist.push([T.v,h,T.t,T.c,T.r]);if(m.hist.length>70)m.hist.shift();
  if(st!==m.prevS){onTransition(m,m.prevS,st);m.prevS=st;}
 });
}
function push(kind,msg){try{if(location.protocol.startsWith('http'))fetch('/api/notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,msg})}).catch(()=>{})}catch(e){}}

function onTransition(m,a,b){
 const t=new Date().toLocaleTimeString(),P=m.pred;
 if(b==='w'||b==='c'){alerts.unshift({id:uid++,m:m.name,i:m.i,sev:b,t,txt:`${b==='c'?'CRITICAL':'WARNING'} — ${P.ftype} (${Math.round(P.fp*100)}% risk)`,ack:false,note:b==='c'?notify('Critical',m.name):''});}
 if(b==='c'){tasks[m.i]={m:m.name,issue:P.ftype,conf:Math.round(P.fp*100),act:P.rec,due:'Today'};}
 if(b==='h'&&(a==='w'||a==='c')){alerts.unshift({id:uid++,m:m.name,i:m.i,sev:'h',t,txt:'RECOVERED — telemetry back to normal',ack:false,note:notify('Recovery',m.name)});delete tasks[m.i];}
 alerts=alerts.slice(0,30);
}

function sideHTML(){
 const m=M[sel],P=m.pred,T=m.tel,n=P.n,f=AI.features(T);
 const rul=P.rul==null?'—':`${Math.floor(P.rul)}h ${Math.floor((P.rul%1)*60)}m`;

 const row=(a,b)=>`<div class="row"><span style="color:var(--m)">${a}</span><b>${b}</b></div>`;
 const ins=M.filter(x=>x.status==='c'||x.status==='w').map(x=>`<div class="box" style="border-color:${COL[x.status]}" onclick="pick(${x.i})"><b style="color:${COL[x.status]}">${x.status==='c'?'CRITICAL':'WARNING'} · ${x.name}</b><br>${x.pred.ftype} · health ${x.pred.health}% · risk ${pc(x.pred.fp)}</div>`).join('')||'<div class="box">All machines nominal.</div>';
 const st=STOCK[AI.parts(P.ftype)],part=AI.parts(P.ftype);
 return `<button onclick="detail=false;refresh()">← All machines</button><h3 style="margin-top:8px">Selected machine</h3><div style="font:600 16px system-ui">${m.name.toUpperCase()} ${tag(m.status)}</div>

 ${row('Temperature',T.t.toFixed(1)+' °C')}${row('Vibration',T.v.toFixed(2)+' mm/s')}${row('Motor current',T.c.toFixed(2)+' A')}${row('RPM',Math.round(T.r))}${row('Load',Math.round(T.l)+'%')}${row('Power',T.pw.toFixed(1)+' kW')}${row('Operating hours',Math.round(m.hrs).toLocaleString())}

 ${row('Anomaly score',P.anom.toFixed(2)+(P.anom>.6?' · ANOMALY':''))}${row('Failure probability',pc(P.fp))}${row('Predicted failure',P.ftype)}${row('AI RUL prediction',rul)}
 <details class="box" style="border-color:var(--a)"><summary style="cursor:pointer"><b>Why is this machine unhealthy?</b></summary>${why}</details>

 <canvas id="ch" width="310" height="80" style="width:100%;background:#0a1220;border-radius:5px"></canvas><div style="color:var(--m);font-size:9px">Vibration (cyan) vs health (green) · live</div>
 <details><summary style="cursor:pointer;color:var(--m)">Other AI insights</summary>${ins}</details>`;}
function draw(){const c=$('ch');if(!c)return;const g=c.getContext('2d'),h=M[sel].hist;g.clearRect(0,0,310,80);
 [[0,'#22d3ee',v=>80-clamp(v,0,9)/9*76],[1,'#22c55e',v=>80-v/100*76]].forEach(([k,col,fy])=>{g.beginPath();g.strokeStyle=col;g.lineWidth=1.5;h.forEach((p,i)=>{const x=i/69*310;i?g.lineTo(x,fy(p[k])):g.moveTo(x,fy(p[k]));});g.stroke();});}

function refresh0(){
 const avg=M.reduce((a,m)=>a+m.pred.health,0)/M.length,mn=Math.min(...M.map(m=>m.pred.health)),f=clamp(mn/80,.35,1);
 window.FLOW=f;const out=Math.round(1240*f),risk=M.filter(m=>m.pred.fp>.4).length,act=alerts.filter(a=>!a.ack&&a.sev!=='h').length;
 $('he').textContent=Math.round(78*f+ (1-f)*0)+'%';$('ho').textContent=out.toLocaleString()+' u/hr';$('hh').textContent=Math.round(avg)+'%';$('hr').textContent=risk;$('ha').textContent=act;
 $('hs').textContent=f<.6?'DELAYED':'RUNNING';$('hs').style.color=f<.6?COL.c:'var(--g)';$('hv').textContent=(100-M.filter(m=>m.status==='c').length*4).toFixed(0)+'%';
 $('tgt').textContent=M[sel].name;$('side').innerHTML=detail?sideHTML():listHTML();draw();
 $('al').innerHTML=alerts.slice(0,6).map(a=>`<div class="box" style="border-color:${COL[a.sev]}"><b>${a.m}</b> <span style="color:var(--m)">${a.t}</span><br>${a.txt}${a.note?`<br><span style="color:var(--a)">${a.note}</span>`:''}<br><button onclick="ack(${a.id})">${a.ack?'Acknowledged':'Acknowledge'}</button> <button onclick="pick(${a.i})">View machine</button></div>`).join('')||'<span style="color:var(--m)">No alerts.</span>';
 const T=Object.values(tasks);$('mt').innerHTML=T.length?`<table>${T.map(t=>`<tr><td><b>${t.m}</b><br>${t.issue}</td><td>${t.conf}%<br><span class="tag" style="background:#ef444422;color:var(--r)">HIGH</span></td><td>${t.act}<br><span style="color:var(--m)">Due: ${t.due} · Pending</span></td></tr>`).join('')}</table>`:'<span style="color:var(--m)">No AI-generated tasks. Inject a fault to start the demo.</span>';

}

// ===== 3D DIGITAL TWIN =====

scene.add(new THREE.GridHelper(50,50,0x1c2a40,0x111b2c));
const stripe=new THREE.Mesh(new THREE.PlaneGeometry(30,.25),new THREE.MeshBasicMaterial({color:0xd9a800}));stripe.rotation.x=-Math.PI/2;stripe.position.set(0,.02,2.6);scene.add(stripe);

const bx=(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));

const P=(g,o,x,y,z,rx,ry,rz)=>{o.position.set(x,y,z);o.rotation.set(rx||0,ry||0,rz||0);g.add(o);return o;};
